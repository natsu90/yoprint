services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            DUCKDB_PHP_PATH: /opt/duckdb
        volumes:
            - '.:/var/www/html'
            - 'sail-duckdb:/opt/duckdb'
            - './docker/php/ffi.ini:/etc/php/8.4/cli/conf.d/99-ffi.ini'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_started
            redis:
                condition: service_started
            duckdb:
                condition: service_completed_successfully
    duckdb:
        image: 'alpine:3.21'
        environment:
            DUCKDB_VERSION: '${DUCKDB_VERSION:-1.5.1}'
            DUCKDB_PHP_VERSION: '${DUCKDB_PHP_VERSION:-v2.1.0}'
        volumes:
            - 'sail-duckdb:/opt/duckdb'
        networks:
            - sail
        command:
            - sh
            - -c
            - |
                set -e
                if [ -f /opt/duckdb/libduckdb.so ] && [ -f /opt/duckdb/duckdb-ffi.h ] && [ -x /opt/duckdb/duckdb ]; then
                    echo "DuckDB $${DUCKDB_VERSION} already installed in /opt/duckdb"
                    exit 0
                fi
                case "$$(uname -m)" in
                    x86_64) ARCH=amd64 ;;
                    aarch64) ARCH=arm64 ;;
                    *) echo "Unsupported architecture: $$(uname -m)"; exit 1 ;;
                esac
                apk add --no-cache curl unzip > /dev/null
                cd /tmp
                curl -fsSL -o libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/v$${DUCKDB_VERSION}/libduckdb-linux-$${ARCH}.zip"
                unzip -oj libduckdb.zip libduckdb.so -d /opt/duckdb
                curl -fsSL -o duckdb_cli.zip "https://github.com/duckdb/duckdb/releases/download/v$${DUCKDB_VERSION}/duckdb_cli-linux-$${ARCH}.zip"
                unzip -oj duckdb_cli.zip duckdb -d /opt/duckdb
                chmod +x /opt/duckdb/duckdb
                curl -fsSL -o /opt/duckdb/duckdb-ffi.h "https://raw.githubusercontent.com/satur-io/duckdb-php/$${DUCKDB_PHP_VERSION}/header/linux-$${ARCH}/duckdb-ffi.h"
                echo "DuckDB $${DUCKDB_VERSION} ($${ARCH}) installed in /opt/duckdb"
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    horizon:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DUCKDB_PHP_PATH: /opt/duckdb
        volumes:
            - '.:/var/www/html'
            - 'sail-duckdb:/opt/duckdb'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_started
            redis:
                condition: service_started
            duckdb:
                condition: service_completed_successfully
        command: php artisan horizon
    sse:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            DUCKDB_PHP_PATH: /opt/duckdb
        volumes:
            - '.:/var/www/html'
            - 'sail-duckdb:/opt/duckdb'
        networks:
            - sail
        depends_on:
            mysql:
                condition: service_started
            redis:
                condition: service_started
            duckdb:
                condition: service_completed_successfully
        command: php artisan sse:ping --interval=30
    vite:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        command: npm run dev
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-duckdb:
        driver: local
