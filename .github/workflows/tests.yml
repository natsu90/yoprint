name: Tests

on:
  push:
    branches:
      - master
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

env:
  DUCKDB_VERSION: '1.5.1'
  DUCKDB_PHP_VERSION: 'v2.1.0'
  DUCKDB_PHP_PATH: '/opt/duckdb'

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql/mysql-server:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: laravel
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ALLOW_EMPTY_PASSWORD: 1
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, redis, zip, pcntl, gd, ffi
          ini-values: ffi.enable=true
          coverage: none

      - name: Install DuckDB C library
        run: |
          sudo mkdir -p "$DUCKDB_PHP_PATH"
          curl -fsSL -o /tmp/libduckdb.zip "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          sudo unzip -oj /tmp/libduckdb.zip libduckdb.so -d "$DUCKDB_PHP_PATH"
          curl -fsSL -o /tmp/duckdb-ffi.h "https://raw.githubusercontent.com/satur-io/duckdb-php/${DUCKDB_PHP_VERSION}/header/linux-amd64/duckdb-ffi.h"
          sudo mv /tmp/duckdb-ffi.h "$DUCKDB_PHP_PATH/duckdb-ffi.h"

      - name: Copy environment file
        run: cp .env.example .env

      - name: Override environment for CI
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Install NPM dependencies and build assets
        run: npm ci && npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Create testing database
        run: mysql -h 127.0.0.1 -u root -ppassword -e "CREATE DATABASE IF NOT EXISTS testing; GRANT ALL ON testing.* TO 'sail'@'%';"

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test
